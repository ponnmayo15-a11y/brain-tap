<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1915">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>brain-tap</title>
  <link rel="stylesheet" href="css/style.css?v=20">
</head>
<body>
  <main class="app">
    <section id="screen-home" class="screen is-on">
      <header class="brand">
        <small>brain-tap</small>
        <h1>頭の準備運動</h1>
        <p>課題を選んでください。記録はこの端末だけに残ります。</p>
      </header>
      <button class="menu" type="button" data-game="flash">
        <span>フラッシュ暗算</span>
        <small id="best-flash">まだ記録なし</small>
      </button>
      <button class="menu" type="button" data-game="reverse">
        <span>逆唱</span>
        <small id="best-reverse">まだ記録なし</small>
      </button>
      <button class="menu" type="button" data-game="nback">
        <span>Nバック</span>
        <small id="best-nback">まだ記録なし</small>
      </button>
      <a class="text-btn" href="qr.html">QRコード</a>
      <p class="disclaimer">これは医療ではありません。頭の体操です。</p>
    </section>

    <section id="screen-play" class="screen screen-dark">
      <div class="play-bar">
        <button class="back" type="button" id="play-quit">やめる</button>
        <strong id="play-title"></strong>
      </div>
      <div id="play-stage"></div>
    </section>

    <section id="screen-result" class="screen">
      <header class="brand">
        <small>結果</small>
        <h1 id="result-points">0 点</h1>
        <p id="result-message"></p>
        <p class="muted" id="result-detail"></p>
      </header>
      <button class="menu menu-main" type="button" id="btn-again">
        <span>次</span>
        <small>同じ課題をもう一度</small>
      </button>
      <button class="menu" type="button" id="btn-home">
        <span>トップに戻る</span>
        <small>別の課題を選ぶ</small>
      </button>
    </section>
  </main>
  <script type="module" src="js/app.js?v=20"></script>
</body>
</html>
